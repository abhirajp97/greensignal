[project]
name = "greensignal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "supabase>=2.4",
    "python-dotenv>=1.0",
    "earthengine-api>=1.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "yfinance>=0.2",
    "openpyxl>=3.1.5",
    "statsmodels>=0.14",
    "ipykernel>=6.29",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
